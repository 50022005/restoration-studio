# configs/task3.yaml  –  Soft Mixture-of-Experts  (Milestone 2)
model:
  name: "soft_moe"
  num_experts: 4            # identity + salt + blur + occlusion
  init_from_task2: true     # gate ← classifier weights, experts ← specialists

warmup:
  epochs: 3
  freeze_experts: true

optuna:
  study_name:  "task3_soft_moe"
  n_trials:    15
  direction:   "minimize"
  storage:     "sqlite:////content/drive/MyDrive/genai_assignment/optuna/task3.db"
  load_if_exists: true
  pruner:
    name: "MedianPruner"
    n_startup_trials: 4
    n_warmup_steps:   2
  sampler:
    name: "TPESampler"
    seed: 42
  search_space:
    lr_gate:
      type: "float"
      low:  1.0e-5
      high: 1.0e-3
      log:  true
    lr_experts:
      type: "float"
      low:  1.0e-6
      high: 1.0e-4
      log:  true
    temperature:
      type: "float"
      low:  0.5
      high: 5.0
      log:  false
    lambda_rec:
      type: "float"
      low:  0.5
      high: 1.0
      step: 0.1
    lambda_ssim:
      type: "float"
      low:  0.1
      high: 0.5
      step: 0.05
    lambda_cls:
      type: "float"
      low:  0.01
      high: 0.5
      log:  true
    lambda_bal:
      type: "float"
      low:  0.001
      high: 0.1
      log:  true
  trial_epochs: 3

training:
  max_epochs:    15
  optimizer:     "AdamW"
  weight_decay:  1.0e-5
  amp:           true
  clip_grad_norm: 1.0
  checkpoint_dir: "/content/drive/MyDrive/genai_assignment/checkpoints/task3"
  onnx_path:      "/content/drive/MyDrive/genai_assignment/models/task3_soft_moe.onnx"

loss_init:
  lambda_rec:  0.80
  lambda_ssim: 0.20
  lambda_cls:  0.10
  lambda_bal:  0.01
  temperature: 1.0

logging:
  project: "genai-assignment"
  tags:    ["task3", "soft-moe", "milestone2"]
