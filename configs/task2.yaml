# configs/task2.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Corruption Classifier + Hard-Routed Specialist Autoencoders  (Task 2)
# ─────────────────────────────────────────────────────────────────────────────

classifier:
  name: "corruption_classifier"
  in_channels: 3
  num_classes: 4   # clean, salt_pepper, blur, occlusion
  optuna:
    study_name:  "task2_classifier"
    n_trials:    15
    direction:   "maximize"   # maximise validation accuracy
    storage:     "sqlite:////content/drive/MyDrive/genai_assignment/optuna/task2_clf.db"
    load_if_exists: true
    pruner:
      name: "MedianPruner"
      n_startup_trials: 4
      n_warmup_steps:   2
    sampler:
      name: "TPESampler"
      seed: 42
    search_space:
      lr:
        type: "float"
        low:  1.0e-4
        high: 5.0e-3
        log:  true
      batch_size:
        type: "categorical"
        choices: [32, 64, 128]
      base_channels:
        type: "categorical"
        choices: [16, 32, 64]
      dropout:
        type: "float"
        low:  0.0
        high: 0.5
        step: 0.1
      weight_decay:
        type: "float"
        low:  1.0e-5
        high: 1.0e-2
        log:  true
    trial_epochs: 5
  training:
    max_epochs:    20
    optimizer:     "AdamW"
    scheduler:     "CosineAnnealingLR"
    amp:           true
    clip_grad_norm: 1.0
    balanced_batches: true     # class-balanced sampling required by spec
    checkpoint_dir: "/content/drive/MyDrive/genai_assignment/checkpoints/task2_clf"
    onnx_path:      "/content/drive/MyDrive/genai_assignment/models/task2_classifier.onnx"

specialists:
  # One shared Optuna search → 3 independently trained models
  corruption_types: ["salt_pepper", "blur", "occlusion"]
  shared_optuna:
    study_name:  "task2_specialist_arch"
    n_trials:    15
    direction:   "maximize"
    storage:     "sqlite:////content/drive/MyDrive/genai_assignment/optuna/task2_specialist.db"
    load_if_exists: true
    pruner:
      name: "MedianPruner"
      n_startup_trials: 4
      n_warmup_steps:   2
    sampler:
      name: "TPESampler"
      seed: 42
    search_space:
      lr:
        type: "float"
        low:  1.0e-4
        high: 1.0e-2
        log:  true
      batch_size:
        type: "categorical"
        choices: [16, 32, 64]
      bottleneck_dim:
        type: "int"
        low:  64
        high: 512
        step: 64
      base_channels:
        type: "categorical"
        choices: [16, 32, 48]
      alpha:
        type: "float"
        low:  0.50
        high: 0.95
        step: 0.05
    trial_epochs: 5
  training:
    max_epochs:    20
    optimizer:     "AdamW"
    weight_decay:  1.0e-4
    scheduler:     "CosineAnnealingLR"
    amp:           true
    clip_grad_norm: 1.0
    checkpoint_dir: "/content/drive/MyDrive/genai_assignment/checkpoints/task2_specialists"
    onnx_dir:      "/content/drive/MyDrive/genai_assignment/models"

logging:
  project: "genai-assignment"
  tags:    ["task2", "hard-routing", "milestone1"]
