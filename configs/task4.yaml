# configs/task4.yaml  –  Style-Conditioned cGAN  (Milestone 2)
model:
  name: "face_sketch_cgan"
  in_channels: 3
  out_channels: 1            # grayscale sketch output
  num_styles: 3
  patch_size: 70             # PatchGAN receptive field

optuna:
  study_name:  "task4_cgan"
  n_trials:    10
  direction:   "minimize"
  storage:     "sqlite:////content/drive/MyDrive/genai_assignment/optuna/task4.db"
  load_if_exists: true
  pruner:
    name: "MedianPruner"
    n_startup_trials: 3
    n_warmup_steps:   1
  sampler:
    name: "TPESampler"
    seed: 42
  search_space:
    lr_G:
      type: "float"
      low:  1.0e-5
      high: 5.0e-4
      log:  true
    lr_D:
      type: "float"
      low:  1.0e-5
      high: 5.0e-4
      log:  true
    batch_size:
      type: "categorical"
      choices: [4, 8, 16]
    base_channels:
      type: "categorical"
      choices: [32, 64]
    dropout:
      type: "float"
      low:  0.0
      high: 0.5
      step: 0.1
    style_emb_dim:
      type: "categorical"
      choices: [8, 16, 32]
    lambda_L1:
      type: "float"
      low:  10.0
      high: 200.0
      log:  true
  trial_epochs: 3

training:
  max_epochs:    40
  optimizer_G:   "Adam"
  optimizer_D:   "Adam"
  betas:         [0.5, 0.999]
  amp:           false        # GAN + AMP can cause instability; keep false
  clip_grad_norm: 1.0
  log_sample_every: 5        # log generated samples every N epochs
  checkpoint_dir: "/content/drive/MyDrive/genai_assignment/checkpoints/task4"
  onnx_path:      "/content/drive/MyDrive/genai_assignment/models/task4_generator.onnx"

loss_init:
  lambda_L1: 100.0

logging:
  project: "genai-assignment"
  tags:    ["task4", "cgan", "milestone2"]
