# configs/task1.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Universal Denoising Autoencoder  (Task 1)
# ─────────────────────────────────────────────────────────────────────────────

model:
  name: "universal_ae"
  in_channels: 3
  out_channels: 3
  skip_connections: false    # DISABLED per spec – no unrestricted skip paths

optuna:
  study_name:  "task1_universal_ae"
  n_trials:    20
  direction:   "maximize"     # maximise combined SSIM + (1-L1) objective
  storage:     "sqlite:////content/drive/MyDrive/genai_assignment/optuna/task1.db"
  load_if_exists: true
  pruner:
    name: "MedianPruner"
    n_startup_trials: 5
    n_warmup_steps:   2
  sampler:
    name: "TPESampler"
    seed: 42
  search_space:
    lr:
      type: "float"
      low:  1.0e-4
      high: 1.0e-2
      log:  true
    batch_size:
      type: "categorical"
      choices: [16, 32, 64]
    bottleneck_dim:
      type: "int"
      low:  64
      high: 512
      step: 64
    base_channels:
      type: "categorical"
      choices: [16, 32, 48]
    dropout:
      type: "float"
      low:  0.0
      high: 0.4
      step: 0.05
    alpha:
      type: "float"
      low:  0.50
      high: 0.95
      step: 0.05
  trial_epochs: 5             # ≈ 3-4 min / trial on T4

training:
  max_epochs:    30           # ≈ 20-25 min total on T4 after Optuna
  optimizer:     "AdamW"
  weight_decay:  1.0e-4
  scheduler:     "CosineAnnealingLR"
  amp:           true         # mixed precision for ~1.5× speedup
  clip_grad_norm: 1.0
  checkpoint_dir: "/content/drive/MyDrive/genai_assignment/checkpoints/task1"
  onnx_path:      "/content/drive/MyDrive/genai_assignment/models/task1_universal.onnx"

logging:
  project: "genai-assignment"
  tags:    ["task1", "universal-ae", "milestone1"]
  log_every_n_steps: 50
